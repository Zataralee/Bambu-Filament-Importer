name: Bug report
description: Report a reproducible importer or Bambu Studio integration problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: BFI 0.4.14 and newer can create a sanitized diagnostic ZIP from the Report Bug button. Do not upload Bambu Studio configuration files or unredacted account, printer, network, or access-code information.
  - type: input
    id: importer-version
    attributes:
      label: Importer version
      placeholder: 0.4.14
    validations:
      required: true
  - type: input
    id: studio-version
    attributes:
      label: Bambu Studio version
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model and nozzle
      placeholder: Bambu Lab X1 Carbon, 0.4 mm
  - type: dropdown
    id: destination
    attributes:
      label: Import destination
      options:
        - Device / AMS catalog
        - Bambu Studio Project Library
        - Both
        - Library management or backup
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostic package or screenshots
      description: Attach the ZIP created by BFI's Report Bug button, or paste relevant sanitized details here.
